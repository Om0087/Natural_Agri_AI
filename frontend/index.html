<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Agri AI - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body p { margin-bottom: 0.5em; }
        .markdown-body ul { list-style: disc; margin-left: 1.5em; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">
    <div id="root" class="w-full max-w-3xl h-full sm:h-[95vh] bg-white sm:rounded-2xl shadow-xl flex flex-col overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, loading]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const userText = input;
                setMessages(prev => [...prev, { role: "user", text: userText }]);
                setInput("");
                setLoading(true);

                try {
                    const res = await fetch("http://localhost:8000/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: userText })
                    });
                    
                    const data = await res.json();
                    setMessages(prev => [...prev, { 
                        role: "bot", 
                        text: data.answer, 
                        sources: data.sources 
                    }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: "bot", text: "⚠️ Backend Server ચાલુ નથી. (Error 500)" }]);
                }
                setLoading(false);
            };

            return (
                <div className="flex flex-col h-full w-full">
                    {/* Header */}
                    <div className="bg-green-700 text-white p-4 flex justify-between items-center shadow-md">
                        <div>
                            <h1 className="text-xl font-bold">🌱 Natural Agri AI</h1>
                            <p className="text-xs opacity-90">તમારો ખેતી અને પ્રાકૃતિક કૃષિ મિત્ર</p>
                        </div>
                        <span className="text-sm bg-green-800 px-3 py-1 rounded-full border border-green-600">EN / ગુજ</span>
                    </div>

                    {/* Chat Box */}
                    <div className="flex-1 overflow-y-auto p-4 bg-slate-50">
                        {messages.length === 0 && (
                            <div className="text-center text-gray-500 mt-20">
                                <h2 className="text-2xl font-bold text-gray-700 mb-2">Welcome!</h2>
                                <p>તમારી ખેતીને લગતી સમસ્યાઓ કે પ્રશ્નો પૂછો.</p>
                            </div>
                        )}
                        {messages.map((msg, i) => (
                            <div key={i} className={`mb-4 flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] p-3 rounded-xl ${msg.role === 'user' ? 'bg-green-600 text-white rounded-tr-none' : 'bg-white border text-gray-800 rounded-tl-none shadow-sm'}`}>
                                    <div className="markdown-body text-[15px]" dangerouslySetInnerHTML={{ __html: msg.role === 'bot' ? marked.parse(msg.text) : msg.text }}></div>
                                    
                                    {/* Sources */}
                                    {msg.sources && msg.sources.length > 0 && (
                                        <div className="mt-3 pt-2 border-t border-gray-100">
                                            <p className="text-xs text-gray-500 font-semibold mb-1">સ્ત્રોત (Sources):</p>
                                            <div className="flex flex-wrap gap-1">
                                                {msg.sources.map((src, idx) => (
                                                    <span key={idx} className="bg-green-50 text-green-700 text-xs px-2 py-1 rounded-md border border-green-100">
                                                        📄 {src.document} (Pg {src.page})
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-gray-500 text-sm ml-2">🤖 Natural Agri AI વિચારી રહ્યો છે...</div>}
                        <div ref={chatEndRef} />
                    </div>

                    {/* Input Area */}
                    <form onSubmit={sendMessage} className="p-3 bg-white border-t flex gap-2">
                        <input 
                            type="text" 
                            value={input} 
                            onChange={(e) => setInput(e.target.value)} 
                            placeholder="અહી તમારો પ્રશ્ન લખો..." 
                            className="flex-1 border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:border-green-500"
                        />
                        <button type="submit" disabled={!input} className="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl disabled:bg-gray-300 transition-colors">
                            Send
                        </button>
                    </form>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
